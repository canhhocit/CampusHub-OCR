name: CampusHub OCR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ocr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 Lint & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Libraries for OpenCV & PaddleOCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax Check
        run: python -m compileall -q app tests

      - name: Run Unit & API Tests
        run: pytest -q --ignore=tests/test_real_models_smoke.py
